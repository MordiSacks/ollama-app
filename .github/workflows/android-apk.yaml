name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/screenshots/**", "fastlane/**"]
  workflow_dispatch:

jobs:
  build:
    name: Analyze and build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: Regenerate translations
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - name: Name APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "ollama-app-v${VERSION}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-app-apk
          path: ollama-app-v*.apk
